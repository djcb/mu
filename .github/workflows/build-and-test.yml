name: Build & run tests

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v2

      - if: contains(matrix.os, 'ubuntu')
        name: ubuntu-deps
        run: |
          sudo apt update
          sudo apt-get install meson ninja-build pkg-config libxapian-dev libglib2.0-dev libgmime-3.0-dev libcli11-dev libfmt-dev libexpected-dev guile-3.0-dev libcld2-dev emacs texinfo

      - if: contains(matrix.os, 'macos')
        name: macos-deps
        run: |
          brew install meson ninja libgpg-error pkg-config glib gmime xapian guile emacs texinfo

      - name: build
        run: make

      - name: test
        run: make test-verbose-if-fail
